{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  (function() {
    var theme = null;
    try { theme = localStorage.getItem('liquid-theme'); } catch (error) {}
    if (theme !== 'light' && theme !== 'dark') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<!-- For all browsers -->
{% comment %}A fresh URL per build keeps cached CSS in sync with the deployed HTML.{% endcomment %}
{% assign asset_version = site.time | date: '%s' %}
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ asset_version }}">

<meta http-equiv="cleartype" content="on">
